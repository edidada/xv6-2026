name: xv6 lab
on:
  push:
    branches: ['edidada/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc gdb-multiarch python3 bc
      - name: Compile and grade
        run: |
          set -o pipefail
          make grade TOOLPREFIX=riscv64-linux-gnu- 2>&1 | tee grade.log
      - name: Preserve and check usertests and page-table transcripts
        run: |
          cp xv6.out usertests.out
          grep -q '^ALL TESTS PASSED' usertests.out
          ./grade-lab-pgtbl pgtbltest
          cp xv6.out pgtbltest.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results
          path: |
            grade.log
            xv6.out*
            usertests.out
            pgtbltest.out
