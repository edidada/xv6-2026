name: xv6 lab
on:
  push:
    branches: ['edidada/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc gdb-multiarch python3 bc
      - name: Compile and grade
        run: |
          set -o pipefail
          make grade TOOLPREFIX=riscv64-linux-gnu- 2>&1 | tee grade.log
      - name: Observe syscall and null-load trap using GDB
        run: python3 ci/syscall-gdb.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-results
          path: |
            grade.log
            xv6.out*
            syscall-gdb.log
            null-load-gdb.log
            syscall-qemu.log
            null-load-qemu.log
